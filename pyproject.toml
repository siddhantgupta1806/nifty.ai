[project]
name = "nifty-ai"
version = "0.1.0"
description = "Multi-agent algorithmic trading + backtesting for Indian markets (TradingAgents × OpenAlgo × Jesse-style engine)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Nifty.AI Contributors" }]

dependencies = [
    # Multi-agent core
   # "tradingagents==0.7.0",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    # OpenAlgo integration
    "openalgo==1.0.50",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "websockets>=12.0",
    # MCP client (for binding OpenAlgo MCP tools into agents)
    "mcp>=0.9.0",
    # Data + storage
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    # Indicators
    "pandas-ta>=0.3.14b0",
    "stockstats>=0.6.2",
    # Reporting
    "quantstats>=0.0.62",
    "matplotlib>=3.8.0",
    # Time / calendar
    "pytz>=2024.1",
    "python-dateutil>=2.9.0",
    # CLI + config
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "responses>=0.25.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]

[project.scripts]
nifty = "nifty_ai.cli.main:app"
nifty-mcp = "nifty_ai.mcp.server:main"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nifty_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src/nifty_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "live: requires a running OpenAlgo instance (skipped by default)",
    "slow: long-running tests",
]
