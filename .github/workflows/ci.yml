name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TradingAgents
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/TauricResearch/TradingAgents.git@v0.7.0"

      - name: Install Nifty.AI
        run: |
          python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q